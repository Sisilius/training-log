<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f1115">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Дневник тренировок</title>
  <link rel="stylesheet" href="styles.css?v=5">
</head>
<body>
  <header id="app-header" hidden>
    <div class="brand">Дневник тренировок</div>
    <div class="user">
      <span id="user-email"></span>
      <button id="logout" class="link" type="button">Выйти</button>
    </div>
  </header>

  <main>
    <section id="auth-view" class="auth">
      <h1>Дневник тренировок</h1>
      <p class="auth-lead">Вход по email — пришлю ссылку. Пароль не нужен.</p>
      <form id="login-form">
        <label for="email">Email</label>
        <input id="email" type="email" autocomplete="email" placeholder="you@example.com" required>
        <button id="login-button" type="submit">Отправить ссылку</button>
      </form>
      <p id="auth-message" class="message"></p>
    </section>

    <section id="app-view" hidden>
      <div class="toolbar">
        <label class="date-label">
          Дата
          <input type="date" id="date">
        </label>
        <button id="export" type="button">Экспорт CSV</button>
        <button id="check" class="secondary" type="button">Проверить связь</button>
      </div>
      <p id="status" class="status" aria-live="polite"></p>
      <div id="days"></div>
    </section>
  </main>

  <div id="toast" class="toast">Сохранено</div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js?v=5"></script>
  <script src="app.js?v=5"></script>
</body>
</html>
